adapter driver tas_client
reset_config srst_only
adapter speed 5000

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME tc38x
}

if { [info exists OCMTS_TAPID] } {
	set _OCMTS_TAPID $CPU_SWD_TAPID
} else {
	set _OCMTS_TAPID 0x20205083
}

transport select ifxdap
# Create new ocmts 
ifxdap newtap $_CHIPNAME ocmts -irlen 8 -expected-id $_OCMTS_TAPID
ocmts create tc3xx -chain-position $_CHIPNAME.ocmts

# Create targets
target create $_CHIPNAME.cpu0 aurix -coreid 0 -ocmts tc3xx
target create $_CHIPNAME.cpu1 aurix -coreid 1 -ocmts tc3xx
target create $_CHIPNAME.cpu2 aurix -coreid 2 -ocmts tc3xx
target create $_CHIPNAME.cpu3 aurix -coreid 3 -ocmts tc3xx

# Create flash banks
flash bank pfls0 tc3xx 0x80000000 0x300000 0 0 $_CHIPNAME.cpu0
flash bank pfls1 tc3xx 0x80300000 0x300000 0 0 $_CHIPNAME.cpu1
flash bank pfls2 tc3xx 0x80600000 0x300000 0 0 $_CHIPNAME.cpu2
flash bank pfls3 tc3xx 0x80900000 0x300000 0 0 $_CHIPNAME.cpu3

targets $_CHIPNAME.cpu0