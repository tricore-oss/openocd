namespace import testing_helpers::*

adapter driver dummy
adapter speed 1000
transport select jtag
jtag newtap tap cpu -irlen 5
target create flash_update_target testee -chain-position tap.cpu -gdb-port 0
flash bank test.flash faux 0x1000 0x10000 1 1 flash_update_target
tcl port disabled
telnet port disabled

# The testee target does not need a physical JTAG scan.
proc jtag_init {} {}
init

foreach options {
	{}
	{erase}
	{unlock}
	{verify}
	{erase unlock}
	{unlock erase}
	{erase verify}
	{verify erase}
	{unlock verify}
	{verify unlock}
	{erase unlock verify}
	{erase verify unlock}
	{unlock erase verify}
	{unlock verify erase}
	{verify erase unlock}
	{verify unlock erase}
	{verify erase unlock verify erase}
} {
	flash update_image {*}$options unused 0 build
	flash update_image {*}$options unused 0x1000 build
	check_syntax_err {flash update_image {*}$options}
	check_syntax_err {flash update_image {*}$options unused 0 build extra_arg}
	check_error_matches {} {flash update_image {*}$options unused invalid_offset build}
}

shutdown
