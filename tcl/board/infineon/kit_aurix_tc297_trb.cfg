#
# Board configuration for the Infineon TriBoard TC297 (KIT_AURIX_TC297_TRB).
# The kit has an on-board miniWiggler JDS (USB 058b:0043) driven via the TAS server.

source [find interface/tas_client.cfg]

reset_config srst_only
adapter speed 5000

source [find target/infineon/tc29x.cfg]
