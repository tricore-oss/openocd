# Target configuration for Infineon AURIX TC4Dx devices.

if { [info exists CHIPNAME] } {
    set _CHIPNAME $CHIPNAME
} else {
    set _CHIPNAME tc4dx
}

if { [info exists OCMTS_TAPID] } {
    set _OCMTS_TAPID $OCMTS_TAPID
} else {
    set _OCMTS_TAPID 0x10225083
}

transport select ifxdap
# Create new ocmts
ifxdap newtap $_CHIPNAME ocmts -irlen 8 -expected-id $_OCMTS_TAPID
ocmts create tc4xx -chain-position $_CHIPNAME.ocmts

# Create targets
target create $_CHIPNAME.cpu0 tricore -coreid 0 -ocmts tc4xx -dbgbase 0xF8800000
target create $_CHIPNAME.cpu1 tricore -coreid 1 -ocmts tc4xx -dbgbase 0xF8840000
target create $_CHIPNAME.cpu2 tricore -coreid 2 -ocmts tc4xx -dbgbase 0xF8880000
target create $_CHIPNAME.cpu3 tricore -coreid 3 -ocmts tc4xx -dbgbase 0xF88C0000
target create $_CHIPNAME.cpu4 tricore -coreid 4 -ocmts tc4xx -dbgbase 0xF8900000
target create $_CHIPNAME.cpu5 tricore -coreid 5 -ocmts tc4xx -dbgbase 0xF8940000
target create $_CHIPNAME.cpucs tricore -coreid 6 -ocmts tc4xx -dbgbase 0xF8980000

# Create flash banks
flash bank pfls00 tc4x_eflash 0x80000000 0x200000 0 0 $_CHIPNAME.cpu0
flash bank pfls01 tc4x_eflash 0x80200000 0x200000 0 0 $_CHIPNAME.cpu0
flash bank pfls10 tc4x_eflash 0x80400000 0x200000 0 0 $_CHIPNAME.cpu1
flash bank pfls11 tc4x_eflash 0x80600000 0x200000 0 0 $_CHIPNAME.cpu1
flash bank pfls20 tc4x_eflash 0x80800000 0x100000 0 0 $_CHIPNAME.cpu2
flash bank pfls21 tc4x_eflash 0x80900000 0x100000 0 0 $_CHIPNAME.cpu2
flash bank pfls30 tc4x_eflash 0x80A00000 0x200000 0 0 $_CHIPNAME.cpu3
flash bank pfls31 tc4x_eflash 0x80C00000 0x200000 0 0 $_CHIPNAME.cpu3
flash bank pfls40 tc4x_eflash 0x80E00000 0x200000 0 0 $_CHIPNAME.cpu4
flash bank pfls41 tc4x_eflash 0x81000000 0x200000 0 0 $_CHIPNAME.cpu4
flash bank pfls50 tc4x_eflash 0x81200000 0x100000 0 0 $_CHIPNAME.cpu5
flash bank pfls51 tc4x_eflash 0x81300000 0x100000 0 0 $_CHIPNAME.cpu5
flash bank pflscs tc4x_eflash 0x84000000 0x100000 0 0 $_CHIPNAME.cpucs

targets $_CHIPNAME.cpu0
