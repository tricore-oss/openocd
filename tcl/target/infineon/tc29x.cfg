#
# Target configuration for Infineon AURIX TC29x devices (1st generation AURIX).
#
# TC29x has three TriCore cores 1.6P (performance) cores. 
# The SFR/CSFR layout matches TC3xx:
# per-CPU SFR block at 0xF8800000 + coreid * 0x20000, CSFRs at +0x10000.

if { [info exists CHIPNAME] } {
set _CHIPNAME $CHIPNAME
} else {
set _CHIPNAME tc29x
}

if { [info exists OCMTS_TAPID] } {
set _OCMTS_TAPID $OCMTS_TAPID
} else {
set _OCMTS_TAPID 0x201E9083
}

transport select ifxdap
# Create new ocmts. 
ifxdap newtap $_CHIPNAME ocmts -irlen 8 -expected-id $_OCMTS_TAPID 
ocmts create tc2xx -chain-position $_CHIPNAME.ocmts

# Create targets
target create $_CHIPNAME.cpu0 tricore -coreid 0 -ocmts tc2xx -dbgbase 0xF8800000
target create $_CHIPNAME.cpu1 tricore -coreid 1 -ocmts tc2xx -dbgbase 0xF8820000
target create $_CHIPNAME.cpu2 tricore -coreid 2 -ocmts tc2xx -dbgbase 0xF8840000

# Create workarea in CPU0 DSPR
$_CHIPNAME.cpu0 configure -work-area-phys 0x70000000 -work-area-size 0x8000 -work-area-backup 0

# Create flash banks: 2x 2MB PFlash, 384KB DFlash EEPROM
flash bank pfls0 tc2x_eflash 0x80000000 0x200000 0 0 $_CHIPNAME.cpu0
flash bank pfls1 tc2x_eflash 0x80200000 0x200000 0 0 $_CHIPNAME.cpu0
flash bank pfls2 tc2x_eflash 0x80400000 0x200000 0 0 $_CHIPNAME.cpu0
flash bank pfls3 tc2x_eflash 0x80600000 0x200000 0 0 $_CHIPNAME.cpu0
flash bank dfls0 tc2x_eflash 0xAF000000 0xC0000 0 0 $_CHIPNAME.cpu0
flash bank ucb tc2x_eflash 0xAF100000 0x4000 0 0 $_CHIPNAME.cpu0
flash bank dfls1 tc2x_eflash 0xAF110000 0x10000 0 0 $_CHIPNAME.cpu0

targets $_CHIPNAME.cpu0
